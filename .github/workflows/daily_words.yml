name: Daily Words (Gemini)

on:
  schedule:
    - cron: "0 20 * * *"        # 毎日 20:00 UTC = 翌 05:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: "何日分まとめて生成するか（初回に14などを推奨）"
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's words with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
        run: |
          python scripts/gen_words.py \
            --date "$(TZ=Asia/Tokyo date +%Y-%m-%d)" \
            --days "${{ github.event.inputs.days || '1' }}"

      - name: Commit generated words
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add words used.json
          git commit -m "words: $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "no changes"
          git push
